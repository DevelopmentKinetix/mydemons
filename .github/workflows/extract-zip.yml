name: Extract biolink.zip

on:
  push:
    branches: [main]
    paths:
      - 'biolink.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract zip into the repo root
        run: |
          ZIP="biolink.zip"
          if [ ! -f "$ZIP" ]; then
            echo "$ZIP not found - nothing to do."
            exit 0
          fi

          rm -rf /tmp/extract && mkdir /tmp/extract
          unzip -q "$ZIP" -d /tmp/extract
          rm -rf /tmp/extract/__MACOSX

          # If everything sits inside one top-level folder, use that folder's contents
          SRC=/tmp/extract
          if [ "$(find /tmp/extract -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && [ -d "$(find /tmp/extract -mindepth 1 -maxdepth 1)" ]; then
            SRC="$(find /tmp/extract -mindepth 1 -maxdepth 1)"
          fi

          cp -a "$SRC"/. .
          rm -f "$ZIP"

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract biolink.zip"
            git push origin main
          fi
